name: Documentation

on:
  push:
    branches: [ main, doxygen ]
  pull_request:
    branches: [ main ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
        # ubuntu-latest's apt repo only carries doxygen 1.9.8, which predates many tags
        # this Doxyfile uses (PROJECT_ICON, GENERATE_REQUIREMENTS, the Mermaid options,
        # etc.), producing a wall of "ignoring unsupported tag" warnings. Install a
        # pinned recent release from upstream instead, matching local dev usage.
        DOXYGEN_VERSION=1.18.0
        curl -fsSL "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" -o doxygen.tar.gz
        tar -xzf doxygen.tar.gz
        sudo install -m755 "doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
        doxygen --version

    - name: Build documentation
      run: |
        doxygen Doxyfile

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './html'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
