name: static analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: read
  security-events: write

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: checkout isotp-c
      run: |
        git submodule update --init src/tp/isotp-c

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: test that srcs are updated
      run: ./test/test_srcs_are_updated.sh

    - name: lint
      run: CHECK_FORMAT=1 ./tools/run_clang_format.sh

  clang-tidy:
    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: checkout isotp-c
      run: |
        git submodule update --init src/tp/isotp-c

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.15.0
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.workflow }}
        repository-cache: true

    - name: clang-tidy
      run: WARNINGS_AS_ERRORS=1 ./tools/run_clang_tidy.sh

  cppcheck:
    runs-on: ubuntu-latest
    env:
      # driftregion/cppcheck integration branch: upstream cppcheck plus
      # https://github.com/cppcheck-opensource/cppcheck/pull/8879
      # https://github.com/cppcheck-opensource/cppcheck/pull/8876
      # https://github.com/cppcheck-opensource/simplecpp/pull/704
      CPPCHECK_REPO: https://github.com/driftregion/cppcheck.git
      CPPCHECK_SHA: d13e40e5b91c886e643fdc583d3a1cdbd03f3bdd

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: checkout isotp-c
      run: |
        git submodule update --init src/tp/isotp-c

    - name: Cache cppcheck build
      id: cache-cppcheck
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/cppcheck/build
        key: ${{ runner.os }}-cppcheck-${{ env.CPPCHECK_SHA }}

    - name: Build cppcheck
      if: steps.cache-cppcheck.outputs.cache-hit != 'true'
      run: |
        git init "$RUNNER_TEMP/cppcheck"
        cd "$RUNNER_TEMP/cppcheck"
        git fetch --depth 1 "$CPPCHECK_REPO" "$CPPCHECK_SHA"
        git checkout FETCH_HEAD
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j "$(nproc)"

    - name: Verify cppcheck
      run: $RUNNER_TEMP/cppcheck/build/bin/cppcheck --version

    - name: Download MISRA rule texts
      run: make tools/cppcheck/misra_c_2023__headlines_for_cppcheck.txt

    - name: cppcheck MISRA
      run: CPPCHECK=$RUNNER_TEMP/cppcheck/build/bin/cppcheck ./tools/cppcheck/run_MISRA.sh

    - name: Upload cppcheck reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cppcheck-reports
        path: reports/cppcheck/
        retention-days: 30
